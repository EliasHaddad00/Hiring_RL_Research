# Final run list (PREREGISTRATION.md, "Final run list"). Blocks are launched in this order:
# the primary setting, the belief arm for H4b, then the other settings.
# Cutoff rule (Nov 21): an "other settings" block first started after cutoff_date runs
# cutoff_seeds seeds only. The primary setting and the H4b arm always get all seeds.
cutoff_date: 2026-12-04
cutoff_seeds: 10
# Each block runs every actor with its frozen configuration (ppo_final_<actor>.yaml) and every seed.
# Listed and launched by experiments/scripts/final_runs.py. Models stay local (not in git).
seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015]
actors: [index, unrestricted, pooled]
procs: 6                      # width-256 runs: the machine ran out of memory at 12 during tuning
out: results/final
# Hours per run, measured on the tuning runs of the same configurations (estimates, not promises):
# full problem from results/g3/ppo_tuning/finals, small instance from results/g3/small_check.
hours_per_run:
  full: {index: 1.20, unrestricted: 1.97, pooled: 4.54}
  small: {index: 0.40, unrestricted: 1.39, pooled: 2.25}
blocks:
  - {group: primary, setting: h0_0.05, belief: survival}
  - {group: belief arm (H4b), setting: h0_0.05, belief: naive}
  - {group: other settings, setting: small, belief: survival}
  - {group: other settings, setting: none, belief: survival}
  - {group: other settings, setting: h0_0, belief: survival}
  - {group: other settings, setting: h0_0.02, belief: survival}
  - {group: other settings, setting: h0_0.10, belief: survival}
  - {group: other settings, setting: calibrated, belief: survival}

# Must-run ablations (PREREGISTRATION.md, "Final run list"): launched last, with --launch-ablations.
# One value changed at a time from the frozen index configuration, at the primary setting.
# The unchanged arm is the main run with the same seed. Output: results/final/ablations/<name>/.
ablations:
  config: ppo_final_index
  setting: h0_0.05
  belief: survival
  seeds: [1001, 1002, 1003]
  procs: 3
  arms:
    - {name: gamma_0.99, actor: index, override: {gamma: 0.99}}
    - {name: gamma_0.999, actor: index, override: {gamma: 0.999}}
    - {name: ent_coef_third, actor: index, override: {ent_coef: 0.0017056075490486221}}
    - {name: ent_coef_triple, actor: index, override: {ent_coef: 0.015350467941437599}}
    - {name: learning_rate_third, actor: index, override: {learning_rate: 0.00022143821543547453}}
    - {name: learning_rate_triple, actor: index, override: {learning_rate: 0.0019929439389192708}}
    - {name: n_steps_256, actor: index, override: {n_steps: 256}}
    - {name: n_steps_1024, actor: index, override: {n_steps: 1024}}
    - {name: reward_shaping, actor: index, override: {reward_shaping: true}}
    - {name: end_day_pooled, actor: index_end_pooled, override: {}}
